name: Probe

# Experiments: how far GraalVM CE's released native-image gets targeting Windows on ARM64
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline: the recipe itself, for the host (Windows x64)
          - { name: x64-baseline, os: windows-latest, msvc: x64, platform: '' }
          # GraalVM CE windows-x64 emulated on Windows ARM64, targeting it
          - { name: arm64-target, os: windows-11-arm, msvc: arm64, platform: 'org.graalvm.nativeimage.Platform$WINDOWS_AARCH64' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Host
        run: |
          echo "PROCESSOR_ARCHITECTURE=$PROCESSOR_ARCHITECTURE"; uname -a
          systeminfo | grep -iE "^(OS Name|OS Version|System Type)" || true
      - name: GraalVM CE (windows-x64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/graalvm/graalvm-ce-builds/releases/latest --jq .tag_name)
          url=$(gh api "repos/graalvm/graalvm-ce-builds/releases/tags/$tag" --jq '.assets[] | select(.name | endswith("_windows-x64_bin.zip")) | .browser_download_url')
          echo "GraalVM CE $tag: $url"
          curl -sSfL -o graal.zip "$url" && unzip -q graal.zip -d graal
          home=$(dirname "$(find graal -maxdepth 3 -name release | head -1)")
          echo "GRAAL=$PWD/$home" >> "$GITHUB_ENV"
          cat "$home/release"
          "$home/bin/java" -XshowSettings:properties -version 2>&1 | grep -E "os\.(arch|name)|java\.vm\.version"
          ls "$home/lib/svm/builder" "$home/lib/svm/clibraries" || true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Toolchain
        run: |
          which cl link lib || true
          cl 2>&1 | head -2 || true
      - name: GraalVM CE's C libraries (windows-amd64)
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          for l in "$GRAAL"/lib/svm/clibraries/windows-amd64/*.lib; do echo "== $(basename "$l")"; lib -nologo -list "$(cygpath -w "$l")"; done
          ls "$GRAAL/lib/static/windows-amd64" || true
      - name: C libraries (ARM64)
        if: matrix.platform != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: clibs/build.sh "$GRAAL" clibs-out
      - name: Patches
        if: matrix.platform != ''
        run: patches/build.sh "$GRAAL" patch-jars
      - name: native-image
        id: ni
        continue-on-error: true
        run: probe/probe.sh "$GRAAL" out '${{ matrix.platform }}' ${{ matrix.platform != '' && 'patch-jars' || '' }}
      - name: Object
        if: always()
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          for f in $(find out/tmp -name '*.obj' -o -name '*.o' 2>/dev/null); do echo "== $f"; dumpbin -nologo -headers "$f" | head -20; done
          obj=$(find out/tmp -name 'hello.obj' | head -1)
          [ -z "$obj" ] || { dumpbin -nologo -relocations "$obj" | awk '{print $2}' | sort | uniq -c | sort -rn | head -20; }
      - name: Link and run (baseline)
        if: matrix.platform == '' && steps.ni.outcome == 'success'
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          set -euo pipefail
          obj=$(cygpath -w "$(find out/tmp -name 'hello.obj' | head -1)")
          libs=$(cygpath -w "$GRAAL/lib/svm/clibraries/windows-amd64"); static=$(cygpath -w "$GRAAL/lib/static/windows-amd64")
          cl -nologo -MD -I"$(cygpath -w out)" probe/main.c "$obj" -link -LIBPATH:"$libs" -LIBPATH:"$static" \
            libchelper.lib jvm.lib java.lib nio.lib net.lib zip.lib sunmscapi.lib ws2_32.lib mswsock.lib crypt32.lib ncrypt.lib advapi32.lib secur32.lib iphlpapi.lib userenv.lib version.lib \
            -OUT:hello.exe
          ./hello.exe
      - name: The JDK's static libraries (ARM64)
        if: matrix.platform != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The latest successful build of jdk-static-libs.yml
          run=$(gh run list --workflow jdk-static-libs.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" --dir jdklibs
          echo "JDK_LIBS=$(dirname "$(find jdklibs -name java.lib | head -1)")" >> "$GITHUB_ENV"
      - name: Link and run (ARM64)
        if: matrix.platform != '' && steps.ni.outcome == 'success'
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          obj=$(cygpath -w "$(find out/tmp -name 'hello.obj' | head -1)")
          cl -nologo -MD -I"$(cygpath -w out)" probe/main.c "$obj" -link -LIBPATH:"$(cygpath -w clibs-out)" -LIBPATH:"$(cygpath -w "$JDK_LIBS")" \
            libchelper.lib jvm.lib java.lib nio.lib net.lib zip.lib sunmscapi.lib ws2_32.lib mswsock.lib crypt32.lib ncrypt.lib advapi32.lib secur32.lib iphlpapi.lib userenv.lib version.lib \
            -OUT:hello.exe 2>&1 | tee link.log
          { grep -o 'unresolved external symbol [A-Za-z0-9_@?$]*' link.log || true; } | awk '{print $4}' | sort -u | head -100
          dumpbin -nologo -headers hello.exe | grep -i machine
          ./hello.exe; echo "exit: $?"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: |
            out/native-image.log
            out/capcache
            out/tmp/**/*.h
            out/tmp/**/hello.obj
            clibs-out
          if-no-files-found: ignore
